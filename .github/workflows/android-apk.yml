name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Android APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-AI-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: TikTok AI Manager Android APK
          body: "نسخة Android أصلية أولية. توليد القصص محلي بقوالب، والصوت من Android TTS. إنشاء فيديوهات AI وتسجيل TikTok والنشر التلقائي ليست مفعلة بعد."
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
