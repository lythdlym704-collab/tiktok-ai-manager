name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: TikTok AI Manager Android APK
          body: "نسخة تجريبية. ربط TikTok والنشر الرسمي يتطلبان تسجيل تطبيق مطوّر وموافقة TikTok. الصوت يعتمد على محرك وأصوات Android المثبتة."
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
