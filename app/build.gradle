plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lythdlym.tiktokaimanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lythdlym.tiktokaimanager'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    // Keep Java and Kotlin bytecode targets aligned for JDK 17 builds.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
